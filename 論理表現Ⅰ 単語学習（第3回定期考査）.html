<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>論理表現Ⅰ 単語学習（第3回定期考査）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#11141c; --surface:#1b2030; --ink:#e8ecf5; --muted:#99a2b5; --line:#2e3650; --accent:#7693ff; --accent-ink:#0c1326;
    --ok:#6fd499; --ok-bg:#163826; --err:#ff8d85; --err-bg:#3a1b19; --warn:#e3b341; --warn-bg:#352a0f; --star:#f0c245;}
}
:root[data-theme="dark"]{--bg:#11141c; --surface:#1b2030; --ink:#e8ecf5; --muted:#99a2b5; --line:#2e3650; --accent:#7693ff; --accent-ink:#0c1326;
  --ok:#6fd499; --ok-bg:#163826; --err:#ff8d85; --err-bg:#3a1b19; --warn:#e3b341; --warn-bg:#352a0f; --star:#f0c245;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px;min-width:0}
h1{font-family:"Shippori Mincho",serif;font-size:21px;margin:0 0 4px}
h2{font-family:"Shippori Mincho",serif;font-size:18px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.screen{display:none}
.screen.on{display:block}
.menu{display:grid;gap:12px}
.menuBtn{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font:inherit;color:var(--ink);cursor:pointer}
.menuBtn b{display:block;font-family:"Shippori Mincho",serif;font-size:17px;margin-bottom:2px}
.menuBtn span{font-size:13px;color:var(--muted)}
.menuBtn:hover{border-color:var(--accent)}
.btn{font:inherit;font-weight:700;font-size:15px;padding:11px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{font-size:13px;padding:7px 12px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{display:inline-block;margin-bottom:14px;color:var(--accent);text-decoration:none;font-size:14px;cursor:pointer}
.progress{font-size:13px;color:var(--muted);margin-bottom:10px}
.qno{font-size:12px;color:var(--muted)}
.prompt{font-family:"Shippori Mincho",serif;font-size:24px;margin:6px 0 20px;word-break:break-word}
.choices{display:grid;gap:10px;margin-bottom:14px;min-width:0}
.choice{text-align:left;padding:13px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:16px;color:var(--ink);cursor:pointer;width:100%}
.choice.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.choice.wrong{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.choice:disabled{cursor:default}
.utilRow{display:flex;gap:10px;margin:4px 0 4px;flex-wrap:wrap;align-items:center}
.star{font-size:22px;background:none;border:0;cursor:pointer;line-height:1;padding:4px}
.star.on{color:var(--star)}
.star.off{color:var(--line)}
.feedback{min-height:1.6em;font-weight:700;margin-bottom:10px}
.feedback.ok{color:var(--ok)}
.feedback.err{color:var(--err)}
.spellRow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.spellBox{width:32px;height:42px;text-align:center;font-size:19px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;padding:0}
.spellBox.fixed{background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center}
.spellBox.dash{border:0;background:none;width:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.spellBox:focus-visible{outline:2px solid var(--accent)}
.resultBox{text-align:center;padding:30px 10px}
.resultBox .num{font-family:"Shippori Mincho",serif;font-size:40px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:12px;position:sticky;top:0;background:var(--surface)}
.hideBtn{font-size:11px;padding:3px 9px}
.cell{cursor:pointer;display:inline-block;min-width:3em;border-radius:4px;padding:2px 4px}
.cell.hidden{background:var(--line);color:transparent}
.listHead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px}
.listHead:first-child{margin-top:0}
@media (max-width:420px){.spellBox{width:26px;height:38px;font-size:16px}.prompt{font-size:20px}}
</style>
</head>
<body>
<main class="wrap">

<section class="screen on" id="screen-home">
  <h1>論理表現Ⅰ 単語学習</h1>
  <p class="sub">第3回定期考査（S1）範囲：No.635〜898</p>
  <div class="menu">

    <button class="menuBtn" data-mode="je"><b>② 日→英　4択</b><span>日本語の意味を見て、英単語を選びます</span></button>
    <button class="menuBtn" data-mode="spell"><b>③ 日→英　つづり入力</b><span>日本語の意味を見て、英単語を1文字ずつ入力します</span></button>
    <button class="menuBtn" data-go="list"><b>④ 単語リスト</b><span>一覧で確認・お気に入り登録</span></button>
  </div>
</section>

<section class="screen" id="screen-pick">
  <a class="back" data-go="home">← トップへ戻る</a>
  <h2 id="pickTitle"></h2>
  <p class="sub">出題する範囲を選んでください。</p>
  <div class="menu">
    <button class="menuBtn" id="pickAll"><b>すべての単語で挑戦</b><span id="pickAllSub"></span></button>
    <button class="menuBtn" id="pickMistake"><b>間違えたものだけで挑戦</b><span id="pickMistakeSub"></span></button>
  </div>
</section>

<section class="screen" id="screen-quiz">
  <a class="back" data-go="home">← トップへ戻る（記録は保存されます）</a>
  <div class="card">
    <div class="progress" id="qProgress"></div>
    <div class="qno" id="qNo"></div>
    <div class="prompt" id="qPrompt"></div>

    <div id="choiceArea"></div>
    <div id="spellArea"></div>

    <div class="feedback" id="qFeedback"></div>
    <div class="utilRow">
      <button class="btn ghost small" id="idkBtn">わからない・自信がない</button>
      <button class="star off" id="favBtn" type="button" title="お気に入り">★</button>
      <span style="flex:1"></span>
      <button class="btn small" id="nextBtn" style="display:none">次へ</button>
    </div>
  </div>
</section>

<section class="screen" id="screen-result">
  <div class="card resultBox">
    <h2>おつかれさまでした</h2>
    <div class="num" id="resultScore"></div>
    <p class="sub" id="resultSub"></p>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" data-go="home">トップへ戻る</button>
      <button class="btn" id="retryMistakeBtn">間違えたものだけもう一度</button>
    </div>
  </div>
</section>

<section class="screen" id="screen-list">
  <a class="back" data-go="home">← トップへ戻る</a>
  <h2>単語リスト（No.635〜898）</h2>
  <p class="sub">セルをタップすると、1つだけ表示／非表示が切り替わります。★でお気に入り登録。</p>
  <div class="card">
    <div class="listHead">
      <span class="sub" style="margin:0">英単語</span>
      <button class="btn ghost hideBtn" id="hideEnBtn">英単語をすべて隠す</button>
    </div>
    <div class="listHead">
      <span class="sub" style="margin:0">日本語訳</span>
      <button class="btn ghost hideBtn" id="hideJaBtn">日本語訳をすべて隠す</button>
    </div>
    <div style="max-height:62vh;overflow-y:auto;margin-top:8px">
      <table>
        <thead><tr><th>No</th><th>英単語</th><th>日本語訳</th><th>★</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </div>
</section>

</main>

// ==CORE_START==
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeChoices(words,correctIdx,answerKey,rnd){
  const correct=words[correctIdx][answerKey];
  const pool=words.filter((w,i)=>i!==correctIdx&&w[answerKey]!==correct);
  const picked=shuffle(pool,rnd).slice(0,3).map(w=>w[answerKey]);
  return shuffle([correct,...picked],rnd);
}
function spellBoxes(en){
  return en.split('').map((ch,i)=>{const isLetter=/[a-zA-Z]/.test(ch);return{ch,fixed:!isLetter||i===0,isLetter};});
}
function checkSpelling(typed,en){return typed.trim().toLowerCase()===en.toLowerCase();}
function loadStore(raw){try{return JSON.parse(raw||'{}');}catch(e){return{};}}
function markWrong(store,no){store[no]=store[no]||{};store[no].mistake=true;return store;}
function markCorrect(store,no){if(store[no])store[no].mistake=false;return store;}
function isMistake(store,no){return!!(store[no]&&store[no].mistake);}
function toggleFav(store,no){store[no]=store[no]||{};store[no].fav=!store[no].fav;return store;}
function isFav(store,no){return!!(store[no]&&store[no].fav);}
// ==CORE_END==

/* ===== UI ===== */
const $=s=>document.querySelector(s);
const KEY='vocab-s1-635-898:v1';
let store=loadStore(localStorage.getItem(KEY));
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$('#'+id).classList.add('on');window.scrollTo(0,0);}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>show('screen-'+b.dataset.go)));

const WORD_BY_NO={};WORDS.forEach(w=>{WORD_BY_NO[w[0]]=w;});
function mistakeCount(){return WORDS.filter(w=>isMistake(store,w[0])).length;}
function favCount(){return WORDS.filter(w=>isFav(store,w[0])).length;}

/* ---- モード選択 ---- */

$('#retryMistakeBtn').addEventListener('click',()=>{

  if(mc===0){show('screen-home');return;}
  startQuiz(session.mode,WORDS.filter(w=>isMistake(store,w[0])));
});

/* ---- クイズ本体 ---- */
let session=null;
function startQuiz(mode,wordSet){
  if(!wordSet.length){show('screen-home');return;}
  const rnd=mulberry32(Date.now()&0xffffffff);
  session={mode,order:shuffle(wordSet,rnd),idx:0,correct:0,rnd,answered:false};
  show('screen-quiz');
  renderQuestion();
}
function currentWord(){return session.order[session.idx];}
function renderQuestion(){
  const w=currentWord();
  session.answered=false;
  $('#qProgress').textContent=(session.idx+1)+' / '+session.order.length+'　（正解 '+session.correct+'）';
  $('#qNo').textContent='No.'+w[0];
  $('#qFeedback').textContent='';$('#qFeedback').className='feedback';
  $('#nextBtn').style.display='none';
  $('#idkBtn').disabled=false;
  updateFav(w[0]);
  if(session.mode==='spell'){
    $('#choiceArea').innerHTML='';
    $('#qPrompt').textContent=w[2];
    renderSpell(w);
  }else{
    $('#spellArea').innerHTML='';
    const answerKey=session.mode==='ej'?2:1;
    $('#qPrompt').textContent=session.mode==='ej'?w[1]:w[2];
    const choices=makeChoices(session.order,session.idx,answerKey,session.rnd);
    const box=document.createElement('div');box.className='choices';
    choices.forEach(c=>{
      const b=document.createElement('button');b.className='choice';b.textContent=c;
      b.addEventListener('click',()=>answerChoice(b,c,w[answerKey]));
      box.appendChild(b);
    });
    $('#choiceArea').innerHTML='';$('#choiceArea').appendChild(box);
  }
}
function updateFav(no){
  const star=$('#favBtn');
  star.className='star '+(isFav(store,no)?'on':'off');
}
$('#favBtn').addEventListener('click',()=>{
  const w=currentWord();store=toggleFav(store,w[0]);save();updateFav(w[0]);
});
function lockChoices(){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);}
function finishAnswer(correct,no){
  session.answered=true;
  if(correct){session.correct++;store=markCorrect(store,no);}
  else{store=markWrong(store,no);}
  save();
  $('#idkBtn').disabled=true;
  $('#nextBtn').style.display='inline-block';
}
function answerChoice(btn,picked,correctVal){
  if(session.answered)return;
  lockChoices();
  const w=currentWord();
  const ok=picked===correctVal;
  btn.classList.add(ok?'correct':'wrong');
  if(!ok){
    document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correctVal)b.classList.add('correct');});
  }
  $('#qFeedback').textContent=ok?'正解！':'不正解　正解：'+correctVal;
  $('#qFeedback').className='feedback '+(ok?'ok':'err');
  finishAnswer(ok,w[0]);
}
function renderSpell(w){
  const boxes=spellBoxes(w[1]);
  const row=document.createElement('div');row.className='spellRow';
  const inputs=[];
  boxes.forEach((b,i)=>{
    if(!b.isLetter){
      const d=document.createElement('div');d.className='spellBox dash';d.textContent=b.ch;row.appendChild(d);inputs.push(null);return;
    }
    const el=document.createElement('input');
    el.className='spellBox'+(b.fixed?' fixed':'');
    el.maxLength=1;el.autocomplete='off';el.inputMode='text';el.spellcheck=false;
    if(b.fixed){el.value=b.ch;el.disabled=true;}
    row.appendChild(el);inputs.push(el);
  });
  $('#spellArea').innerHTML='';$('#spellArea').appendChild(row);
  const editable=inputs.filter(x=>x&&!x.disabled);
  editable.forEach((el,i)=>{
    el.addEventListener('input',()=>{
      el.value=el.value.replace(/[^a-zA-Z]/g,'').slice(0,1);
      if(el.value&&i<editable.length-1)editable[i+1].focus();
      if(el.value&&i===editable.length-1)checkSpellAnswer(inputs,w);
    });
    el.addEventListener('keydown',e=>{
      if(e.key==='Backspace'&&!el.value&&i>0)editable[i-1].focus();
    });
  });
  if(editable.length)setTimeout(()=>editable[0].focus(),0);
}
function checkSpellAnswer(inputs,w){
  if(session.answered)return;
  const typed=inputs.map(x=>x?x.value:'').join('');
  inputs.forEach(x=>{if(x)x.disabled=true;});
  const ok=checkSpelling(typed,w[1]);
  $('#qFeedback').textContent=ok?'正解！':'不正解　正解：'+w[1];
  $('#qFeedback').className='feedback '+(ok?'ok':'err');
  if(!ok){
    inputs.forEach((x,i)=>{if(x)x.value=w[1][i];});
  }
  finishAnswer(ok,w[0]);
}
$('#idkBtn').addEventListener('click',()=>{
  if(session.answered)return;
  const w=currentWord();
  if(session.mode==='spell'){
    const row=$('#spellArea .spellRow');
    let li=0;
    [...row.children].forEach(c=>{
      if(c.classList.contains('dash'))return;
      c.disabled=true;c.value=w[1][li];li++;
    });
  }else{
    lockChoices();
    document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===(session.mode==='ej'?w[2]:w[1]))b.classList.add('correct');});
  }
  const ans=session.mode==='ej'?w[2]:w[1];
  $('#qFeedback').textContent='正解：'+ans;
  $('#qFeedback').className='feedback err';
  finishAnswer(false,w[0]);
});
$('#nextBtn').addEventListener('click',()=>{
  session.idx++;
  if(session.idx>=session.order.length){finishQuiz();return;}
  renderQuestion();
});
function finishQuiz(){
  $('#resultScore').textContent=session.correct+' / '+session.order.length;
  const mc=mistakeCount();
  $('#resultSub').textContent=mc>0?('今、間違えたままの単語が '+mc+' 語あります。'):'間違えた単語はありません。';
  $('#retryMistakeBtn').style.display=mc>0?'inline-block':'none';
  show('screen-result');
}

/* ---- 単語リスト ---- */
let hideEn=false,hideJa=false;
const revealedEn=new Set(),revealedJa=new Set();
function renderList(){
  const body=$('#listBody');body.innerHTML='';
  WORDS.forEach(w=>{
    const tr=document.createElement('tr');
    const tdNo=document.createElement('td');tdNo.textContent=w[0];
    const tdEn=document.createElement('td');
    const enHidden=hideEn&&!revealedEn.has(w[0]);
    const enSpan=document.createElement('span');enSpan.className='cell'+(enHidden?' hidden':'');enSpan.textContent=w[1];
    enSpan.addEventListener('click',()=>{if(revealedEn.has(w[0]))revealedEn.delete(w[0]);else revealedEn.add(w[0]);renderList();});
    tdEn.appendChild(enSpan);
    const tdJa=document.createElement('td');
    const jaHidden=hideJa&&!revealedJa.has(w[0]);
    const jaSpan=document.createElement('span');jaSpan.className='cell'+(jaHidden?' hidden':'');jaSpan.textContent=w[2];
    jaSpan.addEventListener('click',()=>{if(revealedJa.has(w[0]))revealedJa.delete(w[0]);else revealedJa.add(w[0]);renderList();});
    tdJa.appendChild(jaSpan);
    const tdFav=document.createElement('td');
    const star=document.createElement('button');star.className='star '+(isFav(store,w[0])?'on':'off');star.textContent='★';star.style.fontSize='16px';
    star.addEventListener('click',()=>{store=toggleFav(store,w[0]);save();renderList();});
    tdFav.appendChild(star);
    tr.append(tdNo,tdEn,tdJa,tdFav);
    body.appendChild(tr);
  });
}
$('#hideEnBtn').addEventListener('click',()=>{hideEn=!hideEn;revealedEn.clear();$('#hideEnBtn').textContent=hideEn?'英単語をすべて表示':'英単語をすべて隠す';renderList();});
$('#hideJaBtn').addEventListener('click',()=>{hideJa=!hideJa;revealedJa.clear();$('#hideJaBtn').textContent=hideJa?'日本語訳をすべて表示':'日本語訳をすべて隠す';renderList();});
document.querySelector('[data-go="list"]').addEventListener('click',renderList);
</script>
</body>
</html>
